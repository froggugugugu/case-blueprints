# project-config.yaml — 利用者プロジェクトの中央設定
#
# このファイルは人間(あなた)が編集します。
# Claude は読み取りますが、原則として書き換えません(constitution §1)。
#
# setup.sh で初期化された直後は、以下の値はサンプルです。
# あなたのプリンタ・材料に合わせて書き換えてください。

project:
  name: ribbit-m5stick-gps-logger-exterior # プロジェクト名(英数字+ハイフン推奨)
  version: 0.1.0

cad_backend:
  type: cadquery                  # 当面は cadquery 固定。将来 openscad / freecad-py を予約
  python_version: "3.11"

print_settings:
  printer_bed: [210, 210, 205]    # X, Y, Z (mm)。ANYCUBIC MEGA-S
  nozzle_diameter: 0.4            # mm
  default_material: PLA           # PLA / PETG / ABS / TPU など

design_rules:
  min_wall_thickness: 1.6         # mm (ノズル径 × 4 が目安)
  hole_clearance: 0.2             # mm (穴に入れるピンの余裕)
  fit_clearance: 0.2              # mm (フタなど嵌合の隙間)
