case:
  name: ribbit-m5stick-gps-logger-exterior
  type: lidded_box
  closure:
    method: snap_lip_with_hinge       # 嵌合リップ + 蝶番(脱落防止)+ ラッチ(retention)
    lid_axis: "+X"                    # 蓋は +X 面(縦持ち時の上端、タバコ箱型)
    snap_fit:
      lip_height: 2.0                 # 蓋リップが本体内部に押し込まれる深さ(印刷オーバーハング配慮)
      fit_clearance: 0.4              # 片側クリアランス。2026-05-02 改訂: 0.2 では蝶番固定下で嵌合不可、FDM 公差を吸収するため 0.4 に拡大
    hinge:
      side: "-Y"                      # 本体の -Y 辺に蝶番(carabiner と反対側)
      axis: "Z"                       # 蝶番回転軸は Z 方向
    catch:
      side: "+Y"                      # 蝶番の反対側、+Y 面に snap bump
  print_orientation:
    body: bottom_down                 # 本体は -X 端を下にして印刷(積層方向 = +X)
    lid: top_down                     # 蓋はリップ側を下にして印刷
  split:
    enabled: false
  layout:
    arrangement: side_by_side
    orientation: vertical             # 利用時は長軸 X=125mm を垂直に持つ
    notes: |
      持ち方:
        - ケースを縦方向に持つ。長軸 X=125mm が垂直。
        - +X 端が上(蓋)、-X 端が下(底)。
        - +Y 面と -Y 面が広面、+Z 面と -Z 面が狭面(タバコ箱と同じ比率)。
        - +Y 面: カラビナタブ(吊り下げ側)+ ラッチ(指で開ける側)。
        - -Y 面: 蝶番(蓋を保持する側)。
      配置方針:
        - 全機器の長軸を X 軸に揃え、縦長のケースとする。
        - バッテリー(長軸91mm) と M5+GPS ペア(長軸48mm) を Y 軸方向に並べる。
        - M5StickS3 と GPS は Z 軸方向に積み重ね(深さ 13.5 + 8 = 21.5mm)。
      ポート向き:
        - バッテリー USB-A は +X 方向。
        - M5StickS3 USB-C も +X 方向。
        - 蓋(+X)を開けると両機器の上端(USB ポート + ケーブル取り回し部)が
          直接見える。
      ケーブル取り回し:
        - USB-A → USB-C: バッテリー +X 端から M5StickS3 +X 端へ短い U 字型。
          コネクタ突出 + ケーブル湾曲で X 方向に +35mm の余裕(計 126mm)。
        - Grove: M5StickS3 と GPS の +X 端付近で短く接続。
      内寸目標(X × Y × Z): 約 126 × 55.5 × 24 mm
      # 2026-05-02 拡大: memory 指針「実測値 +1mm 以上」に合わせ、
      # 旧 125 × 54.5 × 23 から +1mm/軸 拡張(本体・蓋とも再印刷対象)。
  features:
    - type: carabiner_tab
      side: "+Y"                      # 本体の +Y 広面に取り付け
      anchor: top_end                 # +X 端寄りに配置
      shape: trapezoid                # 台形(基部広・先端狭)
      base_width_x: 22.0              # X 方向の基部幅 (mm)
      tip_width_x: 14.0               # X 方向の先端幅 (mm)
      extend_y: 14.0                  # Y 方向の突出量 (mm)
      thickness_z: 5.0                # Z 方向の板厚 (mm)
      hole_diameter: 6.0              # 穴径 (mm)
      hole_axis: "Z"                  # 貫通方向(板厚方向)
      hole_offset_from_tip: 7.0       # 先端から穴中心までの Y 距離 (mm)、穴半径 3 + マージン 4
      tip_fillet_radius: 4.0          # 先端 R 面取り (mm)
      base_fillet_radius: 1.5         # 基部 R 面取り (mm)
    - type: hinge
      side: "-Y"                      # 本体 -Y 辺に蝶番ナックル
      anchor: top_end                 # +X 端
      knuckle_diameter: 6.0           # ナックル外径 (mm)
      pin_diameter: 2.0               # ピン径 (M2 ネイル想定)
      knuckle_count_body: 2           # 本体側ナックル個数
      knuckle_count_lid: 1            # 蓋側ナックル個数(本体ナックルの間に挿入)
    - type: catch
      side: "+Y"                      # 蝶番の反対側
      anchor: top_end                 # +X 端
      bump_diameter: 3.0              # 球形 snap 突起の径
      bump_protrusion: 0.6            # 突出量(mm、PLA 弾性で外せる程度)
    - type: body_text
      side: "+Z"                      # 広面(+Z)に盛り上げ加工
      text: "RIBBIT GPS module"
      font_file: ToaHI-Rg.ttf
      sizing: golden_ratio            # フォントサイズは width = ox / φ から自動算出

objects:
  # 座標系: 内寸ボックスの -X/-Y/-Z 角を原点とし、各オブジェクトの -X/-Y/-Z 角の位置 (mm)。
  # rotation は Z 軸回りの回転 (度)。長軸を X 軸に向けるため rotation=90 とする。
  - id: mobile-battery
    position: [0, 0, 0]
    rotation: 90
    note: 長軸 91mm を X に向け、USB-A 端を +X 側(=蓋側)に配置
  - id: m5stick-s3
    position: [0, 30, 0]
    rotation: 90
    note: バッテリーの +Y 隣に配置、USB-C 端を +X 側に向ける
  - id: gps-module
    position: [0, 30, 13.5]
    rotation: 90
    note: M5StickS3 の +Z(縦持ち時の側方向)に積み重ねる
  - id: cable-usb-c
    position: [91, 0, 0]
    rotation: 0
    note: バッテリー +X 端から M5StickS3 +X 端へ U 字に湾曲、蓋直下に位置
  - id: cable-grove
    position: [48, 30, 8]
    rotation: 0
    note: M5StickS3 と GPS の +X 端付近に収納
