# case-config.yaml — 寸法パラメータ(L2 主要編集対象)
#
# 利用者(あなた)はこのファイルを直接編集して寸法を調整できます。
# Claude は値を尊重し、generator.py を再実行します。

walls:
  thickness: 2.0                 # 側壁厚 (mm)、min_wall_thickness 1.6 + 安全側
  bottom_thickness: 2.0          # -X 端(底)の壁厚

lid:
  axis: "+X"                     # 蓋を被せる面("+X" / "-X" / "+Z" 等)
  thickness: 2.5                 # 蓋天板厚み(キャップ天部)
  fit_clearance: 0.2             # 嵌合リップと本体内寸の隙間(片側ごと)
  lip_height: 2.0                # 嵌合リップが本体内部に押し込まれる深さ
  # 注: 蝶番旋回時のリップ最大変位 ≒ 0.04mm @ lip_height=2。fit_clearance 0.2 で余裕大
  # 印刷時のオーバーハングを抑えるため浅め(2mm)に設定
  lip_tip_fillet_radius: 0.5     # 嵌合リップ先端 (-X 端) の R 面取り (リードイン)
  lip_corner_fillet_radius: 0.5  # 嵌合リップ縦 4 エッジの R 面取り

internal:
  object_clearance: 0.5          # オブジェクト周辺の余裕 (mm)
  bracket_clearance: 0.3         # マウント枠との隙間
  cable_bend_allowance: 34.0     # ケーブル湾曲のための +X 余裕(125mm 内寸の根拠: 91 + 34)
  z_margin: 1.0                  # Z 方向の追加マージン (mm)、内寸 Z 23mm の根拠: 22 + 1

fillet:
  outer_radius: 3.0              # 外側角(|X 縦エッジ)の R(手触り重視)
  inner_radius: 0.5              # 内側角の R
  bottom_radius: 1.0             # 本体底面 (-X) 周囲エッジの R(手触り)

carabiner_tab:
  enabled: true
  shape: trapezoid               # 台形(基部広・先端狭)
  base_width_x: 22.0             # 基部の X 寸法 (mm)、本体側
  tip_width_x: 14.0              # 先端の X 寸法 (mm)、穴側
  extend_y: 14.0                 # Y 方向の突出量 (mm)
  thickness_z: 5.0               # Z 方向の板厚 (mm)
  hole_diameter: 6.0             # 貫通穴径 (mm)
  hole_offset_from_tip: 7.0      # 先端から穴中心までの Y 距離(= 穴半径 3 + マージン 4)
  margin_min: 3.0                # 穴周りに必要な最低マージン (mm)
  tip_fillet_radius: 4.0         # 先端 R 面取り (mm)、台形の先端2隅を丸める
  base_fillet_radius: 1.5        # 基部 R 面取り (mm)、本体との取り合い角を丸める
  margin_from_top: 6.0           # +X 端から基部端までのマージン (mm)
  side: "+Y"                     # 取り付け面("+Y" / "-Y" / "+Z" / "-Z")

hinge:
  enabled: true
  side: "-Y"                     # 本体側面のどこに付けるか(carabiner と反対側推奨)
  knuckle_diameter: 6.0          # ナックル(円筒関節)の外径 (mm)
  pin_diameter: 2.0              # 通すピン径 (M2 釘または針金)
  pin_clearance: 0.4             # ピン穴隙間(両側合計)、片側 0.2 ずつ
  knuckle_count_body: 2          # 本体側ナックル個数
  knuckle_count_lid: 1           # 蓋側ナックル個数(本体ナックルの間に挿入)
  knuckle_clearance_z: 0.4       # 蓋ナックルと本体ナックル間の Z 方向クリアランス(片側)
  margin_from_top: 0.0           # +X 端からのマージン (0 = ナックル軸が +X 端面と一致)

body_text:
  enabled: true
  text: "RIBBIT GPS module"      # 表示文字列
  font_file: ToaHI-Rg.ttf        # src/fonts/ 配下のフォントファイル名
  side: "+Z"                     # 配置面("+Z" / "-Z" / "+Y" / "-Y")
  emboss_depth: 0.6              # 盛り上げ高さ (mm)、推奨 0.4-1.0(FDM 0.2 層×3 程度)
  text_width_ratio: 0.618        # 1/φ — 文字列全体が占める X 軸方向の比率
  char_width_factor: 0.55        # 平均字幅 / 字高(ToaHI 用の経験値)
  # font_size_mm: 8.0              # 自動算出を上書きしたい場合のみ指定

catch:
  enabled: true
  side: "+Y"                     # 蝶番反対側に配置
  bump_diameter: 3.0             # 球形 snap 突起の径 (mm)
  bump_protrusion: 0.6           # 突起の突出量 (mm)、PLA 弾性で外せる量
  position_from_top_x: 4.0       # +X 端から突起中心までの X 距離 (mm)
  # 蓋側ラッチ壁(build_lid で上板と一体形成)
  plate_extend_y: 2.5            # 上板を +Y 方向に拡張する量 (mm)、ラッチ壁厚 = この値
  wall_depth_x: 6.0              # ラッチ壁が -X 方向に降りる長さ (mm)
  tip_fillet_radius: 1.0         # ラッチ壁先端 (-X 端) 4 エッジの面取り R (mm)
  side_fillet_radius: 0.5        # ラッチ壁外面 (+Y) 上下エッジの面取り R (mm)
