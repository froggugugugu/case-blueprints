id: mobile-battery
name: モバイルバッテリー
shape: rectangular
front_face: display_side
dimensions:
  width: 30.0
  depth: 21.0
  height: 91.0
tolerance: 0.5
notes: |
  実形状は角丸な直方体(bounding box は W=30 / D=21 / H=91)。
  USB ポートはケース内で使用する想定: モバイルバッテリーから USB-C
  ケーブルを M5StickS3 (下面) に接続したまま収納する。
  外装に USB アクセス穴は不要(蓋を開けて充電・着脱)。
  特殊な放熱・残量表示要件はなし(本体と同様にケースで完全を覆う)。
