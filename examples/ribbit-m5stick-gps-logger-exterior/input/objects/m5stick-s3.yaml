id: m5stick-s3
name: M5StickS3 本体
shape: rectangular
front_face: display_side
dimensions:
  width: 24.0
  depth: 13.5
  height: 48.0
tolerance: 0.5
notes: |
  USB-C ポート: 下面(Z- 側)。GROVE ポートも本体に存在する想定。
  運用方針: 蓋を開けて全オブジェクトを収納 → 蓋を閉めて使用。
  ケース内での操作・視認は不要。ディスプレイ・LED・ボタンはすべてケースで覆う。
  USB-C 充電も蓋を開けて行うため、外装に充電穴は不要。
  装着方法: カラビナ / ストラップ穴をケース外装に設ける。
  構成: M5StickS3 + GPS モジュール + モバイルバッテリーを連結した状態で
  1 つのケースに収納する。
  接続:
    - M5 ↔ GPS モジュール: GROVE ケーブル接続
    - M5 ↔ モバイルバッテリー: USB-C ケーブル接続
  サイズ最適化: 操作開口部ゼロ、ケーブル取り回しを含めて 3 点をできるだけ
  コンパクトに収める方針。
