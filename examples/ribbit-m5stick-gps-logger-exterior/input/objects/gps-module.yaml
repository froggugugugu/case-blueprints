id: gps-module
name: M5Stack 用 GPS ユニット v1.1
shape: rectangular
front_face: display_side
dimensions:
  width: 24.0
  depth: 8.0
  height: 48.0
tolerance: 0.5
notes: |
  M5Stack 用 GPS ユニット v1.1。GROVE ポートで M5StickS3 と接続。
  GPS 受信は PLA 等の 3D プリント外装越しでも可能なため、
  アンテナ用の窓や薄壁化は不要(本体と同じ以上の覆い方で OK)。
  ケース内で M5StickS3・モバイルバッテリーと連結した状態で収納される前提。
