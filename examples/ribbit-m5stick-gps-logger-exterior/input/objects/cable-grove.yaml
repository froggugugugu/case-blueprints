id: cable-grove
name: Grove ケーブル (4-pin)
shape: custom
front_face: custom
dimensions:
  width: 9.4      # コネクタ幅
  depth: 5.2      # ワイヤ4本を平らに並べた想定 (1.3 × 4)
  height: 64.0    # 直線時のおおよその全長 = コネクタ 7.0 + ケーブル 50.0 + コネクタ 7.0
tolerance: 0.5
notes: |
  M5StickS3 と M5Stack GPS ユニット v1.1 を接続する Grove (HY2.0 4-pin) ケーブル。
  両端は同じ Grove コネクタ。

  詳細寸法 (mm):
    コネクタ: L=7.0 / W=9.4 / T=3.5 (両端共通)
    ケーブル: 全長 50.0、芯線 1.3 × 4 本
      - 平らに並べた想定で W=5.2 / T=1.3
      - 束ねた場合は約 2.6 × 2.6 程度

  ケース設計上の扱い:
    - 両端コネクタは剛体、機器の Grove ポートからの突き出しを考慮
    - ケーブル中間部は柔軟、機器間の隙間に逃がせる
    - 全長 50mm のため M5StickS3 と GPS ユニットを近接配置する必要あり
