id: cable-usb-c
name: USB-A → USB-C 給電ケーブル
shape: custom
front_face: custom
dimensions:
  width: 15.1     # USB-A コネクタ幅(両端のうち広い方)
  depth: 7.3      # USB-A コネクタ厚さ
  height: 80.1    # 直線時のおおよその全長 = USB-A 15.5 + ケーブル 50.0 + USB-C 14.6
tolerance: 0.5
notes: |
  モバイルバッテリー(USB-A 出力)から M5StickS3(USB-C 入力)へ給電する短いケーブル。
  ケーブル本体は柔軟で折り曲げ可能。bounding box は直線時の最大寸法を記載。
  接続用途: M5StickS3 ↔ モバイルバッテリー。

  詳細寸法 (mm):
    USB-A コネクタ: L=15.5 / W=15.1 / T=7.3
    USB-C コネクタ: L=14.6 / W=10.3 / T=6.0
    ケーブル本体  : 全長 50.0 / 外径 4.0

  ケース設計上の扱い:
    - 両端のコネクタは剛体として、機器ポート位置からの突き出しを考慮
    - ケーブル中間部は柔軟、機器間の隙間に逃がせる
    - 全長 50mm はかなり短いため、3 点を密接に配置する必要がある
